<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moto Showroom - Formulari</title>
  <link rel="stylesheet" href="css/tokens.css?v=20261127_3">
  <link rel="stylesheet" href="css/styles.css?v=20261127_3">
</head>
<body>
  <!-- Frame: Formulario (Desktop & Responsive Mobile) -->
  <div class="page-container" data-node-id="91:225" data-name="Formulario">
    
    <!-- Navbar -->
    <header class="navbar" data-node-id="91:226" data-name="navbar">
      <a href="MotoShowroomIndex.html" class="nav-brand" data-node-id="91:227">Moto Showroom</a>
      <nav class="nav-menu" data-node-id="91:228" data-name="nav-menu">
        <a href="MotoShowroomIndex.html" class="nav-link" data-node-id="91:229">Motos</a>
        <a href="MotoShowroomIndex.html" class="nav-link" data-node-id="91:230">Husqvarna</a>
        <a href="MotoShowroomBMW.html" class="nav-link" data-node-id="91:231">BMW</a>
        <a href="#sobre-nosaltres" class="nav-link" data-node-id="91:232">Sobre Nosaltres</a>
      </nav>
      <a href="formulario.html" class="nav-cta active" data-node-id="91:233" data-name="nav-cta">
        <span data-node-id="91:234">Contacto</span>
      </a>
    </header>

    <!-- Section Formulario -->
    <main class="form-page-section" data-node-id="91:236" data-name="Pagina Formulari">
      <div class="form-card" data-node-id="91:312" data-name="Seccion Formulari">
        <h1 class="form-title" data-node-id="91:313">Formulari de contacte</h1>

        <form action="#" method="POST" class="form-field-group">
          <!-- Nom i cognoms -->
          <div class="form-field-group" data-node-id="91:314" data-name="nom i cognoms">
            <label for="nom-cognoms" class="form-field-label" data-node-id="91:317">Nom i cognoms</label>
            <input type="text" id="nom-cognoms" name="nom-cognoms" class="form-input" data-node-id="91:316" required>
          </div>

          <!-- Correu electrònic -->
          <div class="form-field-group" data-node-id="91:318" data-name="correu">
            <label for="correu" class="form-field-label" data-node-id="91:319">correu electrònic</label>
            <input type="email" id="correu" name="correu" class="form-input" data-node-id="91:320" required>
          </div>

          <!-- Telèfon de contacte -->
          <div class="form-field-group" data-node-id="91:322" data-name="telefon">
            <label for="telefon" class="form-field-label" data-node-id="91:323">Telèfon de contacte</label>
            <input type="tel" id="telefon" name="telefon" class="form-input" data-node-id="91:324">
          </div>

          <!-- Missatge -->
          <div class="form-field-group" data-node-id="91:326" data-name="missatge">
            <label for="missatge" class="form-field-label" data-node-id="91:327">missatge</label>
            <textarea id="missatge" name="missatge" class="form-textarea" data-node-id="91:328" rows="6"></textarea>
          </div>

          <!-- Enviar Button -->
          <button type="submit" class="form-submit-btn" data-node-id="91:330" data-name="Enviar">
            <span data-node-id="91:336">Enviar</span>
          </button>
        </form>
      </div>
    </main>

  </div>
</body>
</html>
